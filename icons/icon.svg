<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Scale icon -->
  <g stroke="url(#icon)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Scale plate -->
    <ellipse cx="256" cy="180" rx="130" ry="28" stroke-width="22" fill="rgba(255,255,255,0.15)"/>
    <!-- Scale body -->
    <path d="M126 180 Q110 340 256 360 Q402 340 386 180" stroke-width="22"/>
    <!-- Center line -->
    <line x1="256" y1="152" x2="256" y2="208" stroke-width="18"/>
    <!-- Tick marks -->
    <line x1="186" y1="260" x2="206" y2="260" stroke-width="14"/>
    <line x1="186" y1="300" x2="216" y2="300" stroke-width="14"/>
    <line x1="186" y1="340" x2="206" y2="340" stroke-width="14"/>
    <!-- BMI text -->
    <text x="256" y="430" text-anchor="middle" font-family="Inter,Arial,sans-serif"
          font-size="72" font-weight="800" fill="white" stroke="none">BMI</text>
  </g>
</svg>
